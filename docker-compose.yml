services:
  birthday-web:
    image: nginx:alpine
    container_name: birthday-etin-app
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/wishes.json:/usr/share/nginx/html/wishes.json
